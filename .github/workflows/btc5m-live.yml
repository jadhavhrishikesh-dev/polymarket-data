name: BTC5m live recording

on:
  push:
    paths: [btc5m/live.txt, .github/workflows/btc5m-live.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency: {group: btc5m-live, cancel-in-progress: false}

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - run: python btc5m/live.py $(head -1 btc5m/live.txt)
      - if: always()
        run: sleep 420 && python btc5m/pull.py $(( $(head -1 btc5m/live.txt) / 60 + 1 )) 15
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: btc5m-data, path: data/_btc5m/live, if-no-files-found: ignore}
      - if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          python btc5m/save.py "BTC5m live recording"
