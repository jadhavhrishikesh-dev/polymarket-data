name: BTC5m browser-access probe
on:
  push:
    paths: [btc5m/cors_probe.py, .github/workflows/btc5m-cors.yml]
  workflow_dispatch:
permissions: {contents: read, pages: write, id-token: write}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python btc5m/cors_probe.py
      - uses: actions/configure-pages@v5
        continue-on-error: true
        with: {enablement: true}
