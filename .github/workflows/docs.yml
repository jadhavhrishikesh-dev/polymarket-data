name: Fetch docs

on:
  push:
    paths: [docs_urls.txt, docs.sh, .github/workflows/docs.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./docs.sh
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/_docs
          git diff --cached --quiet || git commit -m "Update docs snapshot"
          git pull --rebase origin main && git push
