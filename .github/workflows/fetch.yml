name: Fetch wallet data

on:
  push:
    paths: [wallets.txt, fetch.py, .github/workflows/fetch.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe API
        run: |
          curl -sS -i "https://data-api.polymarket.com/positions?user=$(grep -m1 -E '^0x' wallets.txt)&limit=2" | head -c 1500 || true
      - name: Download data for each wallet
        run: |
          grep -E '^0x' wallets.txt | while read -r w; do
            echo "== $w"; python -u fetch.py "$w"
          done
      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Update wallet data"
          git push
