name: Build Android app

on:
  push:
    paths: [app/**, .github/workflows/apk.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install and generate Android project
        working-directory: app
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android
      - name: Build APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          ./gradlew assembleDebug --no-daemon -q
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/PM-Signals.apk"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete app-latest -y --cleanup-tag || true
          gh release create app-latest PM-Signals.apk -t "PM Signals (latest build)" \
            -n "Built from ${GITHUB_SHA::7}. Install on Android: download PM-Signals.apk and allow installs from your browser or file manager."
