name: Gold discovery
on:
  push:
    paths: [gold/**, .github/workflows/gold.yml]
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: gold, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: python gold/discover.py
      - if: always()
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add data/_gold; git diff --cached --quiet || git commit -m "Gold discovery data"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push && break; sleep 7; done
