name: BTC5m quick history

on:
  push:
    paths: [btc5m/quick.txt, .github/workflows/btc5m-quick.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency: {group: btc5m-quick, cancel-in-progress: false}

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: python btc5m/pull.py $(head -1 btc5m/quick.txt) 15
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: btc5m-data, path: data/_btc5m/live, if-no-files-found: ignore}
      - if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          python btc5m/save.py "BTC5m quick history"
