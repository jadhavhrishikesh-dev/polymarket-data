name: BTC5m quick history

on:
  push:
    paths: [btc5m/quick.txt, .github/workflows/btc5m-quick.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency: {group: btc5m-quick, cancel-in-progress: false}

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: python btc5m/pull.py $(head -1 btc5m/quick.txt) 15
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/_btc5m
          git diff --cached --quiet || git commit -m "BTC5m quick history"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
