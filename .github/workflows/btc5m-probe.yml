name: BTC5m probe

on:
  push:
    paths: [btc5m/probe.sh, .github/workflows/btc5m-probe.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash btc5m/probe.sh
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/_btc5m
          git diff --cached --quiet || git commit -m "BTC5m probe output"
          git pull --rebase origin main && git push
