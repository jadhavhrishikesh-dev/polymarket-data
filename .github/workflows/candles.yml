name: Fetch spot candles

on:
  push:
    paths: [candles.py, .github/workflows/candles.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  candles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -u candles.py
      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/_spot
          git diff --cached --quiet || git commit -m "Update spot candles"
          git pull --rebase origin main && git push
