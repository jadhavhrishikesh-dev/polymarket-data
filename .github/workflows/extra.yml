name: Fetch analysis extras

on:
  push:
    paths: [extra.py, .github/workflows/extra.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extra:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -u extra.py 0xa19cbababc312f9df185e49d7004c249ed1ade6b 300
      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Add analysis extras"
          git pull --rebase origin main && git push
