name: Fetch analysis extras

on:
  push:
    paths: [extra.py, .github/workflows/extra.yml]
  workflow_run:
    workflows: ["Fetch wallet data"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extra:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Extras for each wallet
        run: |
          grep -E '^0x' wallets.txt | while read -r w; do
            if [ -f "data/$w/trades.json" ]; then python -u extra.py "$w" 300; fi
          done
      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Add analysis extras"
          git pull --rebase origin main && git push
