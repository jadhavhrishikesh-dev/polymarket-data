name: BTC5m data

on:
  push:
    paths: [btc5m/pull.py, btc5m/live.py, btc5m/docs.txt, .github/workflows/btc5m.yml]
  workflow_dispatch:
    inputs:
      hours: {default: "48"}
      live_minutes: {default: "40"}

permissions:
  contents: write

concurrency: {group: btc5m, cancel-in-progress: false}

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - run: python btc5m/pull.py ${{ github.event.inputs.hours || '48' }} 15
      - run: |
          mkdir -p data/_btc5m/docs
          while read -r u; do [ -z "$u" ] && continue; f=$(echo "$u" | sed 's#https://##; s#[/?&=]#_#g'); curl -sSL -A "Mozilla/5.0" --max-time 30 "$u" -o "data/_btc5m/docs/$f" || true; done < btc5m/docs.txt
      - uses: actions/upload-artifact@v4
        with: {name: history, path: data/_btc5m}
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: python btc5m/live.py ${{ github.event.inputs.live_minutes || '40' }}
      - uses: actions/upload-artifact@v4
        with: {name: live, path: data/_btc5m/live}
  commit:
    needs: [history, live]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: history, path: data/_btc5m}
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with: {name: live, path: data/_btc5m/live}
        continue-on-error: true
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/_btc5m
          git diff --cached --quiet || git commit -m "BTC5m data"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
